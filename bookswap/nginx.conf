server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # arquivos estáticos com hash no nome (gerados pelo Vite) podem
    # ser cacheados agressivamente
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # fallback de SPA: qualquer rota que não seja um arquivo real
    # (ex: /anuncios/123) deve cair no index.html para o React Router
    # assumir o roteamento no client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
